version: "3.8"

# ==============================================================================
# RESTAURANT SAAS — LOCAL / STAGING DOCKER COMPOSE CONFIGURATION
# ==============================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-saas:latest
    container_name: restaurant-saas-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - JWT_SECRET=${JWT_SECRET:-default_super_secret_key_change_me_in_production}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      # Persistent volume for SQLite data so records survive container restarts
      - sqlite_data:/app/prisma
      - backup_data:/app/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sqlite_data:
    driver: local
  backup_data:
    driver: local
