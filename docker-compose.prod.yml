version: "3.8"

# ==============================================================================
# RESTAURANT SAAS — PRODUCTION DOCKER COMPOSE CONFIGURATION
# ==============================================================================
# Includes:
# - Application container isolated within internal network
# - Nginx reverse proxy with TLS termination and security headers
# - Explicit persistent volume mappings for database and backups
# - Non-privileged container execution and health monitoring
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: restaurant-saas:production
    container_name: restaurant-saas-app-prod
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - internal_net
    volumes:
      # Persistent storage volume for SQLite database
      - sqlite_prod_data:/app/prisma
      # Persistent backup archive storage
      - backup_prod_data:/app/backups
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 25s

  proxy:
    image: nginx:1.25-alpine
    container_name: restaurant-saas-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  sqlite_prod_data:
    driver: local
  backup_prod_data:
    driver: local
